<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .ink { fill: #171717; }
    .paper { fill: #fff; }
    .line { stroke: #171717; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #fafafa; }
      .paper { fill: #0a0a0a; }
      .line { stroke: #fafafa; }
    }
  </style>
  <!-- Ballot with a checkmark -->
  <rect class="paper line" x="9" y="3" width="14" height="15" rx="1.5" stroke-width="2"/>
  <path class="line" d="M12 10.5l2.5 2.5 5-5.5" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Box, with a seam under the lid and a slot on top -->
  <path class="ink" d="M5 16h22l3 6v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>
  <rect class="paper" x="2" y="22" width="28" height="2"/>
  <rect class="paper" x="7" y="18" width="18" height="2" rx="1"/>
</svg>
